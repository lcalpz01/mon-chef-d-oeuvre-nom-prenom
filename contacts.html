<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
</head>

<body>
    <header>
        <nav>
            <a href="/index.html">Accueil</a>
            <a href="details.html">Détails</a>
        </nav>
        <main>
            <form>
                <ul>
                    <li><label for="prenom">Prenom</label>
                        <input type="text" name="prenom" id="prenom" placeholder="Ton prenom" required>
                    </li>

                    <li><label for="email">Email</label>
                        <input type="text" name="email" id="email" placeholder="Ex:olisky@gmail.com" required>
                    </li>

                    <li><label for="ville et code postale">Ville et code postale</label>
                        <input type="text" name="ville et code postale" id="Ville et code postale"
                            placeholder="Ex:123 Rue du bois 69140">
                    </li>

                    <li><label for="message">Message</label>
                        <textarea name="Message" id="Message"></textarea>
                    </li>

                </ul>
                <li><button type="submit">Envoyer</button></li>

            </form>
        </main>

    </header>
</body>

</html>
